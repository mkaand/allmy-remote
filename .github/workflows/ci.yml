name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
      - name: Web dependency integrity
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Web typecheck and build
        working-directory: web
        run: |
          npm run typecheck
          npm run build
      - name: Dependency integrity
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Tests
        run: go test -mod=readonly -race ./...
      - name: Static binary
        run: CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags="-s -w" -o /tmp/allmy-remote ./cmd/server
      - name: Browser acceptance
        working-directory: web
        env:
          ALLMY_TEST_BINARY: /tmp/allmy-remote
        run: |
          npx --no-install playwright install --with-deps chromium
          npm test
      - name: Container build
        run: docker build -t allmy-remote:ci .
      - name: Container smoke test
        run: |
          set -eu
          trap 'docker rm -f allmy-remote-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name allmy-remote-ci --read-only --tmpfs /data:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 allmy-remote:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health | grep -F '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:18080/ready | grep -F '"status":"ready"'
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -F 'Development preview'
          curl --fail --silent --show-error http://127.0.0.1:18080/app.js > /tmp/allmy-web.js
          test -s /tmp/allmy-web.js
          docker stop -t 10 allmy-remote-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' allmy-remote-ci)" = 0
