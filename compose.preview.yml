name: allmy-remote-preview

services:
  server:
    image: allmy-remote:preview
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${ALLMY_PREVIEW_PORT:-18080}:8080"
    environment:
      ALLMY_DATA_DIR: /data/state
      ALLMY_ORIGIN: "http://localhost:${ALLMY_PREVIEW_PORT:-18080}"
    volumes:
      - preview-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 15s
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  preview-data:
